# Continuous integration for the Skywrite CLI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # RustSec advisories, weekly, so new disclosures don't break unrelated PRs.
    - cron: "23 8 * * 1"
  workflow_dispatch:

# Least-privilege by default.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Skywrite supports Unix (Linux and macOS); integration tests use FFmpeg and Python.
  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Homebrew's `ffmpeg` omits libass (the `subtitles` filter) and rubberband;
      # the keg-only `ffmpeg-full` formula has every filter the tests use.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Check test prerequisites
        run: |
          ffmpeg -version
          ffprobe -version
          python3 --version
      # Paid/live tests stay opt-in: no provider credentials, fixture URLs or --ignored.
      - name: Run tests
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/skywrite-test-home/.config
          XDG_CACHE_HOME: ${{ runner.temp }}/skywrite-test-home/.cache
          SKYWRITE_HOME: ${{ runner.temp }}/skywrite-home
          SKYWRITE_CACHE_DIR: ${{ runner.temp }}/skywrite-cache
        run: |
          test_home="$RUNNER_TEMP/skywrite-test-home"
          mkdir -p "$test_home" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$SKYWRITE_HOME" "$SKYWRITE_CACHE_DIR"
          # Keep Cargo/rustup available while the tests inherit a throwaway HOME.
          env CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$test_home" cargo test --locked --no-fail-fast

  # Release Linux binaries are static musl builds; catch musl-only breakage
  # (missing libc symbols, C/C++ dependencies) before a tag. The on-device
  # engine is C++, and musl-tools has no C++ compiler, so the build runs in the
  # same pinned Alpine image as the release (native musl gcc/g++).
  musl:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      # rust:1.100.0-alpine3.24 (multi-arch index); keep in sync with release.yml.
      ALPINE_RUST: rust:1.100.0-alpine3.24@sha256:8d0e82abfdf9a38071e07cabc5afba4ddbe077631a80e4e742a760c38beadc33
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check a static binary
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e TARGET \
            -e TRANSCRIBE_CMAKE_ARGS=-DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            "$ALPINE_RUST" sh -euc '
              apk add --no-cache musl-dev g++ cmake make
              cargo build --locked --target "$TARGET" --no-default-features
              cargo build --locked --target "$TARGET"
            '
          if readelf -l "target/$TARGET/debug/skywrite" | grep -q INTERP || readelf -d "target/$TARGET/debug/skywrite" | grep -q NEEDED; then
            echo "Expected a static musl binary" >&2
            exit 1
          fi
          "target/$TARGET/debug/skywrite" --version
          "target/$TARGET/debug/skywrite" models list --provider ondevice > /dev/null

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked
      # Building without the C++ engine must keep working (no cmake needed).
      - run: cargo check --all-targets --locked --no-default-features

  # Licenses, bans and sources block PRs; advisories run on the schedule.
  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check bans licenses sources

  advisories:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories
