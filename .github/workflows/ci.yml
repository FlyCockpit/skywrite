# Continuous integration for the Skywrite CLI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # RustSec advisories, weekly, so new disclosures don't break unrelated PRs.
    - cron: "23 8 * * 1"
  workflow_dispatch:

# Least-privilege by default.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Skywrite supports Unix (Linux and macOS); integration tests use FFmpeg and Python.
  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Check test prerequisites
        run: |
          ffmpeg -version
          ffprobe -version
          python3 --version
      # Paid/live tests stay opt-in: no provider credentials, fixture URLs or --ignored.
      - name: Run tests
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/skywrite-test-home/.config
          XDG_CACHE_HOME: ${{ runner.temp }}/skywrite-test-home/.cache
          SKYWRITE_HOME: ${{ runner.temp }}/skywrite-home
          SKYWRITE_CACHE_DIR: ${{ runner.temp }}/skywrite-cache
        run: |
          test_home="$RUNNER_TEMP/skywrite-test-home"
          mkdir -p "$test_home" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$SKYWRITE_HOME" "$SKYWRITE_CACHE_DIR"
          # Keep Cargo/rustup available while the tests inherit a throwaway HOME.
          env CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" HOME="$test_home" cargo test --locked

  # Release Linux binaries are static musl builds; catch musl-only breakage
  # (missing libc symbols, C dependencies) before a tag.
  musl:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build and check a static binary
        run: |
          cargo build --locked --target "$TARGET"
          if readelf -l "target/$TARGET/debug/skywrite" | grep -q INTERP; then
            echo "Expected a static musl binary" >&2
            exit 1
          fi
          "target/$TARGET/debug/skywrite" --version

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  # Licenses, bans and sources block PRs; advisories run on the schedule.
  deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  advisories:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
