name: Bug report
description: Report something that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not report security problems here; use private vulnerability reporting (see SECURITY.md).
        Never paste API keys, tokens, secrets or private media or transcripts into an issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Inspect/analyze
        - Transcription
        - Synchronization
        - Edit format/validate/lint
        - Render/export
        - Import
        - Native images (Takumi)
        - Generation/projects
        - Storage (S3/R2)
        - Configuration
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `skywrite --version`, or the commit SHA you built.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and the first line of `ffmpeg -version`; include optional tools and model/provider details as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, with secrets and private content removed. `skywrite doctor` output is often useful.
      render: text
